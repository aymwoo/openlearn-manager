name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Choose edition to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - full
          - lite

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          # GitHub 已下线 Intel 版 macOS 托管运行器（macos-12/13），继续用 macos-13
          # 会让这个任务永远排队，整个 workflow 无法结束。改为在 Apple Silicon
          # 运行器上交叉编译 x86_64-apple-darwin，产物仍可在 Intel Mac 上（Rosetta）运行。
          - os: macos-15
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cache Node.js portable runtime archives
        uses: actions/cache@v4
        with:
          path: .cache/node-dist
          key: node-runtime-${{ matrix.platform }}-v22.23.4
          restore-keys: |
            node-runtime-${{ matrix.platform }}-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release staging directory
        shell: bash
        run: mkdir -p release-artifacts

      # =========================================================================
      # 1. BUILD LITE EDITION (No embedded Node, ~15MB)
      # =========================================================================
      - name: Prepare Lite Edition
        if: ${{ github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'lite' }}
        run: pnpm prepare:node:lite

      - name: Build Lite Edition
        if: ${{ github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'lite' }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Staging Lite artifacts
        if: ${{ github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'lite' }}
        shell: bash
        run: |
          echo "Collecting Lite bundles from bundle directory..."
          find src-tauri/target/ -path "*/bundle/*" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) | while read -r file; do
            base=$(basename "$file")
            ext="${base##*.}"
            name="${base%.*}"
            newname="${name}-Lite.${ext}"
            cp "$file" "release-artifacts/${newname}"
            rm -f "$file"
            echo "Staged Lite bundle: release-artifacts/${newname}"
          done

      # --- 绿色版（免安装 zip）：exe + resources + portable.txt ---
      - name: Package Lite portable (zip)
        if: ${{ matrix.os == 'windows-latest' && (github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'lite') }}
        shell: pwsh
        run: |
          $ver = (node -p "require('./package.json').version").Trim()
          $stage = "OpenLearn-Manager-$ver-x64-portable-Lite"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/openlearn-manager.exe" "$stage/OpenLearn Manager.exe"
          Copy-Item "src-tauri/resources" "$stage/resources" -Recurse -Force
          # 注意：必须用 CRLF（记事本只认 CRLF），并用 utf8BOM 保证任何编辑器都不乱码
          $note = @(
            "OpenLearn Manager 绿色版（便携版）",
            "",
            "有这个文件 = 便携模式：配置、备份、数据库都会写在程序目录下的 data\ 里，",
            "整个文件夹拷到 U 盘即可连数据一起带走。",
            "删掉本文件则恢复为默认行为（写入系统用户目录）。"
          ) -join "`r`n"
          Set-Content -Path "$stage/portable.txt" -Value $note -Encoding utf8BOM -NoNewline
          Compress-Archive -Path $stage -DestinationPath "release-artifacts/OpenLearn.Manager_${ver}_x64-portable-Lite.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force $stage
          Write-Output "Staged portable Lite zip"

      # =========================================================================
      # 2. BUILD FULL EDITION (Embedded Node 22 LTS)
      # =========================================================================
      - name: Prepare Full Edition (Download & Extract Node 22 LTS for ${{ matrix.platform }})
        if: ${{ github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'full' }}
        run: node scripts/prepare-node.mjs --edition full --platform ${{ matrix.platform }}

      - name: Build Full Edition
        if: ${{ github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'full' }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Staging Full artifacts
        if: ${{ github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'full' }}
        shell: bash
        run: |
          echo "Collecting Full bundles from bundle directory..."
          find src-tauri/target/ -path "*/bundle/*" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) | while read -r file; do
            base=$(basename "$file")
            ext="${base##*.}"
            name="${base%.*}"
            newname="${name}-Full.${ext}"
            cp "$file" "release-artifacts/${newname}"
            rm -f "$file"
            echo "Staged Full bundle: release-artifacts/${newname}"
          done

      # --- 绿色版（免安装 zip）：Full 版额外带内嵌 Node 22 LTS ---
      - name: Package Full portable (zip)
        if: ${{ matrix.os == 'windows-latest' && (github.event_name == 'push' || inputs.edition == 'both' || inputs.edition == 'full') }}
        shell: pwsh
        run: |
          $ver = (node -p "require('./package.json').version").Trim()
          $stage = "OpenLearn-Manager-$ver-x64-portable-Full"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/openlearn-manager.exe" "$stage/OpenLearn Manager.exe"
          Copy-Item "src-tauri/resources" "$stage/resources" -Recurse -Force
          if (-not (Test-Path "$stage/resources/node")) {
            Write-Error "Full 绿色版缺少内嵌 Node：resources/node 不存在"
            exit 1
          }
          $note = @(
            "OpenLearn Manager 绿色版（便携版）· Full",
            "",
            "有这个文件 = 便携模式：配置、备份、数据库都会写在程序目录下的 data\ 里，",
            "整个文件夹拷到 U 盘即可连数据一起带走。",
            "删掉本文件则恢复为默认行为（写入系统用户目录）。",
            "",
            "resources\node 是内嵌的 Node 22 LTS，本机无需另外安装 Node.js。"
          ) -join "`r`n"
          Set-Content -Path "$stage/portable.txt" -Value $note -Encoding utf8BOM -NoNewline
          Compress-Archive -Path $stage -DestinationPath "release-artifacts/OpenLearn.Manager_${ver}_x64-portable-Full.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force $stage
          Write-Output "Staged portable Full zip"

      # =========================================================================
      # 3. UPLOAD ASSETS TO GITHUB RELEASE
      # =========================================================================
      - name: Upload Bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive artifacts for manual workflow dispatch
        if: startsWith(github.ref, 'refs/tags/v') == false
        uses: actions/upload-artifact@v4
        with:
          name: openlearn-manager-${{ matrix.platform }}
          path: release-artifacts/*
