[package]
name = "openlearn-manager"
version = "0.1.1"
description = "OpenLearn Manager - Local Web Service GUI"
authors = ["aymwoo"]
edition = "2024"

[lib]
name = "openlearn_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
